<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 RINTU ULTRA DASHBOARD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0a12; color: white; padding: 16px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; }
        .header { text-align: center; margin-bottom: 20px; }
        .card { background: #1a1a2e; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #333; }
        .status-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .status-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #ef4444; vertical-align: middle; margin-right: 8px; }
        .status-dot.online { background: #22c55e; }
        .status-text.online { color: #22c55e; }
        .controls { display: flex; gap: 12px; margin-bottom: 16px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn-start { background: #22c55e; color: #0b0a12; }
        .btn-stop { background: #ef4444; color: white; }
        .inputs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; background: #1a1a2e; padding: 12px; border-radius: 12px; border: 1px solid #333; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        .input-row input { flex: 1; background: #0b0a12; border: 1px solid #333; padding: 10px; border-radius: 8px; color: white; }
        .input-row button { padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #a78bfa; color: white; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .cmd-btn { background: #1a1a2e; border: 1px solid #333; border-radius: 12px; padding: 12px 5px; text-align: center; cursor: pointer; }
        .cmd-btn:hover { border-color: #a78bfa; }
        .cmd-btn i { font-size: 1.4em; display: block; margin-bottom: 5px; }
        .cmd-btn span { font-size: 0.7em; color: #999; }
        .logs { background: #05040a; border-radius: 12px; padding: 12px; border: 1px solid #333; font-family: monospace; font-size: 0.8em; height: 150px; overflow-y: auto; color: #aaa; }
        #sidebar { position: fixed; top: 0; left: -320px; width: 300px; height: 100%; background: #12122b; transition: 0.3s; padding: 20px; z-index: 1000; }
        #sidebar.open { left: 0; }
        #sidebar h2 { color: #a78bfa; text-align: center; margin-bottom: 20px; }
        #sidebar textarea { width: 100%; height: 100px; background: #0b0a12; border: 1px solid #333; color: white; padding: 10px; border-radius: 8px; }
        #sidebar button { width: 100%; padding: 12px; margin-top: 15px; background: #a78bfa; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 999; }
        .overlay.active { display: block; }
    </style>
</head>
<body>
    <div onclick="openSidebar()" style="position: absolute; top: 20px; left: 20px; font-size: 24px; cursor: pointer;">☰</div>
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    <div id="sidebar">
        <div onclick="closeSidebar()" style="text-align: right; font-size: 24px; color: #ef4444; cursor: pointer;">✕</div>
        <h2>Token Manager</h2>
        <textarea id="bulkTokens" placeholder="Paste tokens (1 per line)"></textarea>
        <button onclick="saveTokens()">Load Tokens</button>
        <div id="sidebarMsg" style="color: #22c55e; text-align: center; margin-top: 10px; display: none;">✅ Loaded!</div>
    </div>

    <div class="container">
        <div class="header"><h1>RINTU ULTRA</h1><div style="font-size: 0.75em; color: #999;">SELF-BOT CONTROLLER</div></div>
        <div class="card">
            <div class="status-row">
                <div><span class="status-dot" id="statusDot"></span><span class="status-text" id="statusLabel">OFFLINE</span></div>
                <div><span style="background: #1a1a2e; padding: 4px 12px; border-radius: 12px; font-size: 0.75em; color: #999;"><i class="fas fa-robot"></i> <span id="botCount">0</span> bots</span></div>
            </div>
            <div class="controls">
                <button class="btn btn-start" id="startBtn" onclick="startBot()">▶ START</button>
                <button class="btn btn-stop" onclick="stopBot()">■ STOP</button>
            </div>
            <div class="inputs">
                <div class="input-row">
                    <input type="text" id="channelInput" placeholder="Channel ID">
                    <button onclick="joinChannel()">Join VC</button>
                </div>
                <div class="input-row">
                    <input type="text" id="songInput" placeholder="YouTube or MP3 URL">
                    <button style="background:#ec4899;" onclick="playSong()">Play</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div style="color: #999; font-size: 0.75em; margin-bottom: 12px;">⚡ QUICK COMMANDS</div>
            <div class="grid">
                <div class="cmd-btn" onclick="sendCmd('stop')"><i class="fas fa-stop-circle"></i><span>Stop</span></div>
                <div class="cmd-btn" onclick="sendCmd('pause')"><i class="fas fa-pause-circle"></i><span>Pause</span></div>
                <div class="cmd-btn" onclick="sendCmd('resume')"><i class="fas fa-play-circle"></i><span>Resume</span></div>
                <div class="cmd-btn" onclick="sendCmd('blast')"><i class="fas fa-fire"></i><span>Blast</span></div>
                <div class="cmd-btn" onclick="sendCmd('doubleblast')"><i class="fas fa-bomb"></i><span>Double</span></div>
                <div class="cmd-btn" onclick="sendCmd('superloud')"><i class="fas fa-volume-up"></i><span>Super</span></div>
                <div class="cmd-btn" onclick="sendCmd('forceloud')"><i class="fas fa-bolt"></i><span>Force</span></div>
                <div class="cmd-btn" onclick="sendCmd('bassboost')"><i class="fas fa-music"></i><span>Bass</span></div>
                <div class="cmd-btn" onclick="sendCmd('pungi')"><i class="fas fa-snake"></i><span>Pungi</span></div>
                <div class="cmd-btn" onclick="sendCmd('loudmode')"><i class="fas fa-volume-off"></i><span>Loud</span></div>
                <div class="cmd-btn" onclick="sendCmd('loop')"><i class="fas fa-sync-alt"></i><span>Loop</span></div>
                <div class="cmd-btn" onclick="sendCmd('leave')"><i class="fas fa-sign-out-alt"></i><span>Leave</span></div>
                <div class="cmd-btn" onclick="sendCmd('max')"><i class="fas fa-skull"></i><span>Max</span></div>
                <div class="cmd-btn" onclick="sendCmd('status')"><i class="fas fa-chart-bar"></i><span>Status</span></div>
            </div>
        </div>

        <div class="logs">
            <div style="color:#22c55e; margin-bottom: 8px;">▸ LIVE ENGINE LOGS</div>
            <div id="liveLogs">[SYSTEM] Ready for tokens...</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('active'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('active'); }
        function addLog(msg) {
            const logBox = document.getElementById('liveLogs');
            logBox.innerHTML += `<div>${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }
        function saveTokens() {
            const raw = document.getElementById('bulkTokens').value.trim();
            if (!raw) return alert("Paste tokens!");
            const list = raw.split('\n').map(t => t.trim()).filter(t => t.length > 50);
            if (list.length === 0) return alert("Invalid tokens!");
            socket.emit('start_bot_with_tokens', { tokens: list });
            document.getElementById('sidebarMsg').innerText = `✅ Loaded ${list.length} tokens!`;
            document.getElementById('sidebarMsg').style.display = 'block';
            setTimeout(closeSidebar, 1500);
        }
        function joinChannel() {
            const id = document.getElementById('channelInput').value.trim();
            if (id.length > 10) socket.emit('join_vc', id);
        }
        function playSong() {
            const url = document.getElementById('songInput').value.trim();
            if (url) socket.emit('play_song', url);
        }
        function sendCmd(cmd) { socket.emit('cmd', cmd); }
        function startBot() { socket.emit('start_bots'); }
        function stopBot() { socket.emit('stop_bots'); }

        socket.on('bot-started', (data) => {
            document.getElementById('statusDot').classList.add('online');
            document.getElementById('statusLabel').innerText = 'ONLINE';
            document.getElementById('statusLabel').classList.add('online');
            document.getElementById('botCount').innerText = data.count;
            document.getElementById('startBtn').disabled = true;
            addLog(`[SYSTEM] ${data.count} bot(s) ONLINE!`);
        });
        socket.on('log_event', (data) => { addLog(data.msg); });
        socket.on('bot-stopped', () => {
            document.getElementById('statusDot').classList.remove('online');
            document.getElementById('statusLabel').innerText = 'OFFLINE';
            document.getElementById('statusLabel').classList.remove('online');
            document.getElementById('botCount').innerText = "0";
            document.getElementById('startBtn').disabled = false;
        });
        socket.on('song_playing', (title) => { addLog(`[MUSIC] Now playing: ${title}`); });
    </script>
</body>
</html>
